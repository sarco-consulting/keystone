spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55434}/payment_service
    username: ${DB_USER:keystone}
    password: ${DB_PASSWORD:keystone}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/keystone}

springdoc:
  swagger-ui:
    oauth:
      client-id: keystone-service-client
      # Dev-only secret, already committed in infra/keycloak/keystone-realm.json —
      # pre-filling it here is no additional exposure, just fewer clicks in Swagger UI.
      client-secret: keystone-dev-secret

payment:
  gateway:
    # Points at the WireMock-stubbed external gateway (infra/wiremock) —
    # see docs/architecture.md for why this is mocked rather than real.
    base-url: ${GATEWAY_BASE_URL:http://localhost:8095}

resilience4j:
  circuitbreaker:
    instances:
      payment-gateway:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      payment-gateway:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

otel:
  service:
    name: payment-service
  exporter:
    otlp:
      # 4318, not 4317: the Spring Boot starter's default OTLP protocol is
      # http/protobuf, and 4317 is the gRPC port.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    exporter: otlp
  metrics:
    exporter: none
  logs:
    exporter: none

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

---
spring:
  config:
    activate:
      on-profile: json-logs

logging:
  structured:
    format:
      console: logstash
