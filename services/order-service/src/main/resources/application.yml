spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/order_service
    username: ${DB_USER:keystone}
    password: ${DB_PASSWORD:keystone}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/keystone}

springdoc:
  swagger-ui:
    oauth:
      client-id: keystone-service-client
      # Dev-only secret, already committed in infra/keycloak/keystone-realm.json —
      # pre-filling it here is no additional exposure, just fewer clicks in Swagger UI.
      client-secret: keystone-dev-secret

otel:
  service:
    name: order-service
  exporter:
    otlp:
      # 4318, not 4317: the Spring Boot starter's default OTLP protocol is
      # http/protobuf, and 4317 is the gRPC port.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    exporter: otlp
  metrics:
    exporter: none
  logs:
    exporter: none

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

---
# Structured JSON logs (for log aggregation in a container/prod-like
# context) live behind a profile rather than being the default — human-
# readable console output is what you want while iterating locally.
spring:
  config:
    activate:
      on-profile: json-logs

logging:
  structured:
    format:
      console: logstash
