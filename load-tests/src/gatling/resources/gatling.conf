gatling {
  charting {
    # The "Saga Completion" group wraps polling pauses as well as request
    # time — without this, Gatling's report/console default to *cumulated
    # response time* for groups (sum of child requests, excluding pauses),
    # which understates real end-to-end saga latency. This switches to the
    # group's actual wall-clock duration instead. See ADR-0007 and
    # docs/load-test.md.
    useGroupDurationMetric = true
  }
}
